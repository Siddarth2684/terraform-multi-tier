name: Terraform CI

on:
  push:
    branches:
      - main
      - v2-refactor

  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    env:
      TF_VAR_notification_email: ${{ secrets.TF_VAR_notification_email }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Verify notification email variable
  run: |
    if [ -z "$TF_VAR_notification_email" ]; then
      echo "❌ TF_VAR_notification_email is NOT set"
      exit 1
    else
      echo "✅ TF_VAR_notification_email is set"
    fi

      - name: Terraform Plan
        run: terraform plan -input=false